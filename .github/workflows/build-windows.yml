name: Build Lioma Agent Hub for Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Electron source
        run: npm run check

      - name: Build Windows x64 NSIS installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lioma-Agent-Hub-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14